# onepage: a Preact TSX page in, one self-contained HTML file out. rolldown bundles the module
# graph, encre-css writes the utility sheet, Oxc lints and formats the source, and a strict
# Content-Security-Policy pins the one inline script by its hash. No Node, no npm.
[workspace]
resolver = "3"
members = ["apps/onepage", "packages/pagekit", "xtask"]
default-members = ["apps/onepage", "packages/pagekit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The highest floor any dependency declares (Oxc).
rust-version = "1.97"
authors = ["Michael Borejdo <mborejdo@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mborejdo/onepage"
homepage = "https://github.com/mborejdo/onepage"
# Not on crates.io: Oxc's linter and formatter are git-only dependencies, which `cargo publish`
# refuses.
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
# package.json, read to resolve a vendored or mapped package's entry.
serde_json = "1"
# The CSP hash of the inline script and style.
sha2 = "0.11"
base64 = "0.23"
# The module graph: rolldown links it, Oxc strips TypeScript, compiles JSX and minifies. Pre-1.0
# (Oxc) and fast-moving (rolldown): exact pins, bumped together - rolldown names the Oxc minor.
rolldown = "=1.3.2"
rolldown_common = "=1.3.2"
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_semantic = "=0.158.0"
oxc_span = "=0.158.0"
# rolldown's API is async; one current-thread runtime per bundle drives it.
tokio = { version = "1", default-features = false, features = ["rt"] }
# Tailwind-style utilities from the class names the source uses.
encre-css = "0.21"
# The lint and the formatter, in process: Oxlint's rules and Oxc's formatter. Oxc does not
# publish these crates, so they come from git, at the tag whose Oxc crates are the 0.158.0
# rolldown links (see [patch.crates-io]): one copy of Oxc in the build.
oxc_linter = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_diagnostics = "=0.158.0"
rustc-hash = "2"
# One file per core in the lint; already in the tree through Oxc.
rayon = "1"
# `onepage test`: a JavaScript engine in Rust, behind the off-by-default `test` feature.
boa_engine = "0.22"

# xtask only: the npm tarballs and the font release zips, read in memory.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# The workspace's own crates.
pagekit = { path = "packages/pagekit", version = "0.1.0" }

# Every Oxc crate rolldown takes from crates.io, from the same tag as the linter and the formatter:
# its Oxc version there is the one rolldown names (0.158.0), so the patch applies and one copy of
# Oxc is built. A bump moves rolldown, the `=0.158.0` pins and this tag together.
[patch.crates-io]
oxc = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_ast_macros = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_compat = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_data_structures = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_ecmascript = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_estree = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_isolated_declarations = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_mangler = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_minifier = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_regular_expression = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_str = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_transformer_plugins = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }
oxc_traverse = { git = "https://github.com/oxc-project/oxc", tag = "oxlint_v1.93.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Unavoidable with many transitive deps (rolldown and Oxc pull in several versions of some).
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# No required `# Errors` / `# Panics` sections, no doc-paragraph length limit.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# Contradicts rustc `unreachable_pub`, which is kept.
redundant_pub_crate = "allow"
# Stricter than the groups: no panicking shortcuts or stray output in library code (tests are
# exempt, see clippy.toml), and every `#[allow]` says why.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
