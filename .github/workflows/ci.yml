name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain (with rustfmt and clippy) comes from rust-toolchain.toml; rustup
      # installs it on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - name: test
        run: |
          cargo test --workspace --all-features --locked
          cargo test --no-default-features --locked
      - name: doc
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: deny
        run: cargo deny check
      # The vendored files match the hashes in assets.toml; offline.
      - name: assets
        run: cargo xtask assets --check
      - name: Lint the example pages
        run: for p in examples/*; do cargo run --release --locked -- lint "$p" || exit 1; done
      - name: Type-check the example pages
        run: for p in examples/*; do cargo run --release --locked --features types -- types "$p" || exit 1; done
      - name: Build the example pages
        run: |
          cargo run --release --locked --all-features -- test examples/hello
          cargo run --release --locked -- build examples/hello --out out/hello/index.html
          cargo run --release --locked -- build examples/wasm --out out/wasm/index.html
          cargo run --release --locked --all-features -- test examples/kit
          cargo run --release --locked -- build examples/kit --out out/kit/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-pages
          path: out/
