# cargo-deny: advisories, licences, bans, sources. Run: cargo deny check
[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    # xxhash-rust, through rolldown: the Boost licence, permissive.
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Oxc's linter and formatter: Oxc does not publish them to crates.io, so they (and, through
    # [patch.crates-io], every Oxc crate) come from the tag `oxlint_v1.93.0`.
    "https://github.com/oxc-project/oxc",
]
