# cargo-deny: advisories, licences, bans, sources. Run: cargo deny check
[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 0.9
# option-ext (via Biome's file system crate): MPL-2.0, file-level copyleft, used unmodified.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Biome's lint and formatter crates: Biome does not publish them to crates.io, so they
    # come from the release tag `@biomejs/biome@2.5.14`.
    "https://github.com/biomejs/biome",
    # Biome's analyzer links React's compiler crates, which Biome takes from React's repo at
    # a pinned rev.
    "https://github.com/react/react",
]
