# The vendored and generated files, rebuilt by `cargo xtask assets [NAME]` from these pins.
# Each download must match its sha256. `[out]` is the sha256 of every file written; the run
# updates it, `cargo xtask assets --check` (CI, offline) compares it with the tree.

# The font subsets run fonttools through uv (`uvx`), the one tool outside cargo. brotli writes
# the woff2, uharfbuzz packs the layout tables (fonttools packs them differently without it).
[fonttools]
version = "4.68.0"
brotli = "1.2.1"
uharfbuzz = "0.57.0"

# dist/preact.umd.js and hooks/dist/hooks.umd.js without the sourceMappingURL line.
[preact]
version = "10.29.7"
url = "https://registry.npmjs.org/preact/-/preact-{version}.tgz"
sha256 = "7c0ad67ef994592a5da286b01a0a5d977951ad7ec5ddba85c67c0b7f523de66e"

# The outline paths of these icons from tabler-nodes-outline.json, into panelkit/src/glyphs.ts.
[tabler]
version = "3.45.0"
url = "https://registry.npmjs.org/@tabler/icons/-/icons-{version}.tgz"
sha256 = "be37aa0f2037449c1c381794b33ce4b77bea21f3ec333f14d7030136b89bf4e5"
icons = [
    "alert-circle", "alert-triangle", "arrow-down", "arrow-left", "arrow-narrow-right",
    "arrow-right", "arrow-up", "arrow-up-right", "arrows-sort", "bell", "bolt", "book", "books",
    "box", "braces", "brain", "bulb", "calendar", "calendar-clock", "calendar-month",
    "certificate", "chart-area", "chart-bar", "chart-dots", "chart-line", "chart-pie", "check",
    "chevron-down", "chevron-left", "chevron-right", "chevron-up", "circle-check",
    "circle-dashed", "circle-minus", "circle-x", "clock", "cloud", "code", "copy", "copy-check",
    "cpu", "database", "device-floppy", "dots", "download", "edit", "external-link", "eye",
    "eye-off", "file", "file-text", "filter", "flame", "folder", "gauge", "heart", "help", "home",
    "info-circle", "key", "layout-grid", "layout-sidebar", "leaf", "link", "list", "loader-2",
    "lock", "mail", "map-2", "map-pin", "maximize", "menu-2", "message", "minimize", "minus",
    "moon", "package", "pencil", "phone", "photo", "player-pause", "player-play", "player-stop",
    "plus", "presentation", "printer", "refresh", "ripple", "rotate", "rotate-clockwise", "scale",
    "search", "send", "server", "settings", "share", "shield-check", "snowflake", "sparkles",
    "star", "sun", "table", "tag", "temperature", "terminal-2", "thumb-up", "trash",
    "trending-down", "trending-up", "truck", "upload", "user", "user-off", "users", "weight",
    "world", "x", "zoom-in", "zoom-out",
]

# Each font: `wght` limited, then subset to `unicodes` and `features`, as woff2, into
# panelkit/fonts/<name>.woff2 and panelkit/LICENSE-<name>. `epoch` is SOURCE_DATE_EPOCH for
# the head.modified the instancer stamps.
[fonts]
wght = "300:700"
unicodes = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2195,U+2212,U+2215,U+2248,U+2260,U+2264-2265,U+FEFF,U+FFFD"

[[fonts.font]]
