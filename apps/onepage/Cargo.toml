[package]
name = "onepage"
description = "A Preact TSX page in, one self-contained HTML file out: bundled, minified, CSP-locked."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["preact", "bundler", "html", "static-site", "csp"]
categories = ["command-line-utilities", "web-programming"]

[lints]
workspace = true

[features]
default = []
# `onepage test`: run the page's `src/**/*.test.ts` in boa (an embedded JavaScript engine).
test = ["pagekit/test"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
pagekit.workspace = true
serde.workspace = true
toml.workspace = true
