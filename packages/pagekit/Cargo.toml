[package]
name = "pagekit"
description = "A Preact TSX module graph to one self-contained HTML page with a hash-pinned CSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["preact", "bundler", "html", "csp", "rolldown"]
categories = ["web-programming", "development-tools::build-utils"]

[lints]
workspace = true

[features]
default = []
# `pagekit::test`: run `*.test.ts` files in boa, an embedded JavaScript engine.
test = ["dep:boa_engine"]
# `pagekit::types`: tsrs (the TypeScript 7 checker in Rust) over the page's sources.
types = ["dep:tsrs_lint"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
boa_engine = { workspace = true, optional = true }
encre-css.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_diagnostics.workspace = true
oxc_formatter.workspace = true
oxc_formatter_core.workspace = true
oxc_linter.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
rayon.workspace = true
rolldown.workspace = true
rolldown_common.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tsrs_lint = { workspace = true, optional = true }
toml.workspace = true
