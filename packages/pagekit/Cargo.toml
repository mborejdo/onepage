[package]
name = "pagekit"
description = "A Preact TSX module graph to one self-contained HTML page with a hash-pinned CSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["preact", "bundler", "html", "csp", "swc"]
categories = ["web-programming", "development-tools::build-utils"]

[lints]
workspace = true

[features]
default = []
# `pagekit::test`: run `*.test.ts` files in boa, an embedded JavaScript engine.
test = ["dep:boa_engine"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
biome_analyze.workspace = true
biome_diagnostics.workspace = true
biome_embeds.workspace = true
biome_formatter.workspace = true
biome_js_analyze.workspace = true
biome_js_formatter.workspace = true
biome_js_parser.workspace = true
biome_js_syntax.workspace = true
biome_languages.workspace = true
biome_rowan.workspace = true
boa_engine = { workspace = true, optional = true }
encre-css.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
swc_core.workspace = true
toml.workspace = true
